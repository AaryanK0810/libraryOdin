<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
</head>
<body>
    <div class = 'Library'>
        <h1>My Library</h1>
        <button id="addBook">Add Book</button>
        <button id = 'clearLibrary'>Clear Library</button>
        <div  id = 'libraryContainer'></div>
        <dialog id = 'formPopup'>
            <h2>New Book</h2>
        <form id = 'submitBook'>
        <button id="close-btn" aria-label="Close dialog">×</button>
        <input type = 'text' id = 'title' placeholder = 'Title' required><br>
        <input type = 'text' id = 'author' placeholder = 'Author' required><br>
        <input type = 'number' id = 'pages' placeholder = 'Pages' required><br>
        <label for = 'read'>Read</label>
        <input type = 'checkbox' id = 'read'><br>
        <label for = 'image-chooser'>Choose an image (optional)</label><br>
        <input type = 'file' id = 'image-chooser' accept = 'image/*'><br>
        <button id = 'submit' type = 'submit'>Submit</button>
        </form>
        </dialog>
    </div>
    <script src = 'script.js'></script>
</body>
</html>
